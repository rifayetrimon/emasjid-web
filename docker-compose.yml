services:
  app:
    build: .
    image: cms-display:latest
    ports:
      - "40001:80" # host:container — nginx serves the static site on :80
    restart: unless-stopped
    # Re-point the tenant WITHOUT rebuilding the image: uncomment the volume,
    # point it at a host config.json, edit that file, and refresh the browser.
    # volumes:
    #   - ./configuration/config.json:/usr/share/nginx/html/config.json:ro
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
