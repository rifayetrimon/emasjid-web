services:
  app:
    build: .
    image: cms-display:latest
    ports:
      - "40001:3000" # host:container — app binds 3000 inside, reachable on 40002
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
