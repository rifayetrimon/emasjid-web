server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tenant config must never be cached, so editing config.json (or the
    # mounted volume) takes effect on the next browser refresh.
    location = /config.json {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    # Static export uses trailingSlash, so routes are emitted as
    # `route/index.html`. `$uri/` resolves the directory to its index.html;
    # `$uri.html` covers any non-trailing-slash variant.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Styled 404 page from the export.
    error_page 404 /404.html;
}
