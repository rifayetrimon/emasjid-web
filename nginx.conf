# nginx config TEMPLATE. The Dockerfile installs this at
# /etc/nginx/templates/default.conf.template; the official nginx entrypoint
# runs envsubst over it at container start and writes the result to
# /etc/nginx/conf.d/default.conf. The ONLY token substituted is
# ${API_PROXY_TARGET} (exported by docker-entrypoint.d/10-api-proxy-target.envsh
# from config.json's NEXT_PUBLIC_API_URL). nginx runtime variables like $uri,
# $scheme, $proxy_host are left untouched (they aren't environment vars).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tenant config must never be cached, so editing config.json (or the
    # mounted volume) takes effect on the next browser refresh.
    location = /config.json {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    # Same-origin API proxy. The browser calls /api/... on THIS origin, which
    # needs no CORS preflight; nginx then forwards the request
    # server-to-server to the real upstream. Server-to-server calls are not
    # subject to CORS, so the upstream gateway's missing OPTIONS handler stops
    # mattering. ${API_PROXY_TARGET} is baked from config.json at startup, so
    # /api/v2/cms/... -> ${API_PROXY_TARGET}/api/v2/cms/...
    location /api/ {
        proxy_pass ${API_PROXY_TARGET}/api/;
        proxy_http_version 1.1;
        # Use the upstream's own hostname for TLS SNI + Host header so the
        # gateway routes/cert-matches correctly.
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The upstream can be slow; give it room before failing the request.
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Static export uses trailingSlash, so routes are emitted as
    # `route/index.html`. `$uri/` resolves the directory to its index.html;
    # `$uri.html` covers any non-trailing-slash variant.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Styled 404 page from the export.
    error_page 404 /404.html;
}
